name: Verify runtime
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node --check server.mjs
      - run: node --check electron.mjs
      - run: node --check public/app.js
      - run: node --check public/task-composer.js
      - run: node --check public/feedback.js
      - run: node --check public/live-view.js
      - run: node --check public/event-viewer.js
      - run: node --check public/onboarding.js
      - run: node --check public/locale.js
      - run: node --check public/run-view.js
      - run: node --check public/connection.js
      - run: node --check public/environment.js
      - run: node --check public/run-state.js
      - run: node --check public/execution-view.js
      - run: node --check public/change-check.js
      - run: node --check public/workspace.js
      - run: node --check public/report-view.js
      - run: node --check public/diff-view.js
      - run: node --check scripts/launch.mjs
      - run: node --check scripts/status.mjs
